name: CI and Optional EC2 Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      # Runtime dependencies only: the sqlite3 build chain pulls in advisories
      # that never reach a running container.
      - name: Audit production dependencies
        run: npm run audit:ci

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Validate deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$EC2_HOST" || (echo "Missing EC2_HOST secret" && exit 1)
          test -n "$EC2_USER" || (echo "Missing EC2_USER secret" && exit 1)
          test -n "$EC2_SSH_KEY" || (echo "Missing EC2_SSH_KEY secret" && exit 1)
          test -n "$DEPLOY_PATH" || (echo "Missing DEPLOY_PATH secret" && exit 1)

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host key
        run: ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" <<'EOF'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard origin/main

          mkdir -p data
          if [ -f data/database.sqlite ]; then
            cp data/database.sqlite "data/database.sqlite.backup.$(date +%Y%m%d%H%M%S)"
          fi

          docker compose up -d --build
          docker compose run --rm api node dist/scripts/run-migrations.js

          # Gate on readiness, not liveness: /health answers ok even with an
          # unusable database, so a broken release would pass its own check.
          for attempt in $(seq 1 15); do
            if docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/health/ready').then(async (r) => { const body = await r.text(); if (!r.ok) throw new Error(body); console.log(body); })"; then
              echo "Deployment is ready."
              exit 0
            fi
            echo "Not ready yet (attempt $attempt); retrying in 4s..."
            sleep 4
          done

          echo "Service never became ready; rolling back is manual." >&2
          docker compose logs --tail 100 api >&2
          exit 1
          EOF
