name: CI and Optional EC2 Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      # Runtime dependencies only.
      - name: Audit production dependencies
        run: npm run audit:ci

  # Builds and boots the real image; the unit suite cannot catch a missing COPY.
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t ticket-api:ci .

      - name: Boot it and wait for readiness
        run: |
          docker run -d --name ticket-api-ci -p 3000:3000             -e RUN_MIGRATIONS_ON_START=true             -e SEED_ON_START=true             -e ENABLE_RATE_LIMIT=false             ticket-api:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health/ready > /dev/null 2>&1; then
              echo "Container is ready."
              curl -sS http://127.0.0.1:3000/health/ready
              exit 0
            fi
            sleep 2
          done

          echo "Container never became ready." >&2
          docker logs ticket-api-ci >&2
          exit 1

      - name: Check the published docs are not empty
        run: |
          COUNT=$(curl -fsS http://127.0.0.1:3000/api-docs.json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(Object.keys(JSON.parse(d).paths||{}).length))")
          echo "Swagger paths in the image: $COUNT"
          test "$COUNT" -gt 0 || (echo "Docs rendered zero paths inside the container" >&2 && exit 1)

      - name: Stop the container
        if: always()
        run: docker rm -f ticket-api-ci || true

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-test, docker-image]
    steps:
      - name: Validate deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$EC2_HOST" || (echo "Missing EC2_HOST secret" && exit 1)
          test -n "$EC2_USER" || (echo "Missing EC2_USER secret" && exit 1)
          test -n "$EC2_SSH_KEY" || (echo "Missing EC2_SSH_KEY secret" && exit 1)
          test -n "$DEPLOY_PATH" || (echo "Missing DEPLOY_PATH secret" && exit 1)

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host key
        run: ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" <<'EOF'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          git fetch origin main
          git reset --hard origin/main

          mkdir -p data
          if [ -f data/database.sqlite ]; then
            cp data/database.sqlite "data/database.sqlite.backup.$(date +%Y%m%d%H%M%S)"
          fi

          docker compose up -d --build
          docker compose run --rm api node dist/scripts/run-migrations.js

          # Gate on readiness, not liveness.
          for attempt in $(seq 1 15); do
            if docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/health/ready').then(async (r) => { const body = await r.text(); if (!r.ok) throw new Error(body); console.log(body); })"; then
              echo "Deployment is ready."
              exit 0
            fi
            echo "Not ready yet (attempt $attempt); retrying in 4s..."
            sleep 4
          done

          echo "Service never became ready; rolling back is manual." >&2
          docker compose logs --tail 100 api >&2
          exit 1
          EOF
