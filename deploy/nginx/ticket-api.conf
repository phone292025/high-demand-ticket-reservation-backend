server {
    listen 80;
    server_name your-name.int.yt;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-name.int.yt;

    ssl_certificate /etc/letsencrypt/live/your-name.int.yt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-name.int.yt/privkey.pem;

    # HSTS belongs where TLS terminates, not in the Node app.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The app sets TRUST_PROXY_HOPS=1 to match this single hop. Without the
    # pairing, every client shares one rate-limit bucket.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    location /api/v1 {
        proxy_pass http://127.0.0.1:3000;
    }

    # The installable PWA. Previously unrouted, so /app returned 404 in
    # production while working fine locally.
    location /app {
        proxy_pass http://127.0.0.1:3000;
    }

    location /docs {
        proxy_pass http://127.0.0.1:3000;
    }

    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
    }

    location = / {
        return 302 /app/;
    }
}
