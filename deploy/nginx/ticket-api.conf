server {
    listen 80;
    server_name your-name.int.yt;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-name.int.yt;

    ssl_certificate /etc/letsencrypt/live/your-name.int.yt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-name.int.yt/privkey.pem;

    # Pinned rather than inherited: older nginx defaults still negotiate
    # TLS 1.0/1.1, which no current client needs and every scanner flags.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TicketTLS:10m;
    ssl_session_tickets off;

    # HSTS belongs where TLS terminates, not in the Node app.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The app sets TRUST_PROXY_HOPS=1 to match this single hop. Without the
    # pairing, every client shares one rate-limit bucket.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    location /api/v1 {
        proxy_pass http://127.0.0.1:3000;
    }

    # The installable PWA. Previously unrouted, so /app returned 404 in
    # production while working fine locally.
    location /app {
        proxy_pass http://127.0.0.1:3000;
    }

    location /docs {
        proxy_pass http://127.0.0.1:3000;
    }

    location /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
    }

    location = / {
        return 302 /app/;
    }
}
