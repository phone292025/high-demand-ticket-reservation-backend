services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_PATH: ${DB_PATH:-/app/data/database.sqlite}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
      TYPEORM_LOGGING: ${TYPEORM_LOGGING:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      DEBUG_SECRET: ${DEBUG_SECRET:-}
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
