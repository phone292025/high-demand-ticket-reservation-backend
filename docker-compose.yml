services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DB_PATH: ${DB_PATH:-/app/data/database.sqlite}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      ENABLE_LEGACY_DEMO_ROUTES: ${ENABLE_LEGACY_DEMO_ROUTES:-false}
      ENABLE_PUBLIC_CLEANUP: ${ENABLE_PUBLIC_CLEANUP:-false}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
      TYPEORM_LOGGING: ${TYPEORM_LOGGING:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      DEBUG_SECRET: ${DEBUG_SECRET:-}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      FIREBASE_VAPID_KEY: ${FIREBASE_VAPID_KEY:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:
